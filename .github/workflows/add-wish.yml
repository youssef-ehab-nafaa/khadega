name: Add Khadija wish

# The Cloudflare Worker sends repository_dispatch with the secret
# WISHES_GITHUB_TOKEN. That secret stays on Cloudflare and is never
# placed in the website. This job commits with the built-in github.token,
# which exists only inside GitHub Actions.
on:
  repository_dispatch:
    types: [khadija-wish]
  workflow_dispatch:
    inputs:
      name:
        description: Name
        required: true
        type: string
      message:
        description: Wish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: khadija-wishes
  cancel-in-progress: false

jobs:
  add-wish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          ref: main

      - name: Validate and store the wish
        env:
          WISH_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.name || github.event.client_payload.name }}
          WISH_MESSAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.message || github.event.client_payload.message }}
        run: |
          apply_wish() {
            python3 << 'PY'
          import json, os, re, uuid
          from datetime import datetime, timezone
          from pathlib import Path

          name = re.sub(r"[\u0000-\u001F\u007F]", "", os.environ.get("WISH_NAME", "")).strip()
          message = re.sub(r"[\u0000-\u001F\u007F]", "", os.environ.get("WISH_MESSAGE", "")).strip()

          def reject(reason):
              print(reason)
              raise SystemExit(1)

          if not name or not message:
              reject("Name and wish are required.")
          if len(name) > 50:
              reject("Name is too long.")
          if len(message) > 500:
              reject("Wish is too long.")
          if "<" in name or ">" in name or "<" in message or ">" in message:
              reject("HTML is not allowed.")
          if re.search(r"(?i)<\s*script|javascript:|on\w+\s*=", name + message):
              reject("Scripts are not allowed.")

          path = Path("data/wishes.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          wishes = data.get("wishes", [])
          if not isinstance(wishes, list):
              wishes = []
          if any(item.get("name") == name and item.get("message") == message for item in wishes if isinstance(item, dict)):
              print("Duplicate wish, nothing to commit.")
              raise SystemExit(2)

          wish = {
              "id": str(uuid.uuid4()),
              "name": name,
              "message": message,
              "created_at": datetime.now(timezone.utc).isoformat(timespec="milliseconds").replace("+00:00", "Z"),
          }
          wishes.insert(0, wish)
          path.write_text(
              json.dumps({"wishes": wishes[:500]}, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("Wish stored.")
          PY
          }

          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git checkout -B main origin/main
            set +e
            apply_wish
            status=$?
            set -e
            if [ "$status" -eq 2 ]; then
              echo "No file change."
              exit 0
            fi
            if [ "$status" -ne 0 ]; then
              exit 1
            fi
            git add data/wishes.json
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Add a shared wish for Khadija"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Another wish landed first. Reading the file again."
          done
          echo "Could not store the wish without overwriting another one."
          exit 1
